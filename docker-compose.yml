# =============================================================================
#  Notification Service — local stack
# =============================================================================
#      docker compose up --build
#
#  Credentials come from `.env` (generated by scripts/provision-db.sh and
#  git-ignored). Nothing here contains a real secret, and none of the values
#  below have defaults that would quietly start an insecure stack — the `:?`
#  syntax fails fast with a readable message instead.
#
#  ---------------------------------------------------------------------------
#  !! THIS FILE HAS NOT BEEN EXECUTED ON THE DEVELOPMENT MACHINE !!
#
#  The machine this project was built on has Docker installed but unusable:
#  /var/run/docker.sock is root:docker 0660, the developer is not in the
#  `docker` group, and rootless mode is blocked by a missing uidmap. Every
#  verification in docs/TEST-REPORT.md was therefore performed against
#  PostgreSQL, Kafka and Redis running directly on the host.
#
#  This file is written to the documented behaviour of each image and is
#  believed correct, but it is **unverified**. Treat it accordingly: run it
#  once and read the output rather than assuming it works. Saying so here is
#  better than letting the file imply a test that never happened.
#  ---------------------------------------------------------------------------
#
#  WARNING: `docker compose down -v` deletes the named volumes, and with them
#  the database and every Kafka message. Use plain `docker compose down` to
#  stop the stack and keep the data.
# =============================================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: notification-postgres
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: ${NOTIFICATION_DB_USERNAME:?set NOTIFICATION_DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set NOTIFICATION_DB_PASSWORD in .env}
      # Deterministic collation, so ORDER BY and the functional lower() index
      # behave identically on every machine.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # Bound to localhost only. "5432:5432" would publish the database on
      # every interface, which on a laptop on a café network means exactly that.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready, not a TCP check: the port accepts connections several
      # seconds before the server will answer queries, and the application
      # would start, fail to migrate and exit.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d notification_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.0
    container_name: notification-kafka
    environment:
      # KRaft — no ZooKeeper. A single node acting as both broker and
      # controller, which is the supported single-node configuration from
      # Kafka 3.3 onwards and removes an entire service from this file.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      # Two advertised listeners, and this is the detail that trips everyone up:
      # a client inside the compose network must be told `kafka:9092`, while one
      # on the host must be told `localhost:29092`. A single listener cannot
      # satisfy both, and the symptom of getting it wrong is a client that
      # connects, fetches metadata, and then tries to reach an unreachable host.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Single node: anything above 1 leaves every topic under-replicated and
      # offset commits failing.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Zero, so a freshly created consumer group starts consuming immediately
      # rather than waiting the default three seconds for more members.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "127.0.0.1:29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Asking the broker to list topics proves it is actually serving, which a
      # port check does not: Kafka binds its listener well before the
      # controller has elected a leader and the broker can answer.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: notification-redis
    # Rate-limit counters are disposable by design — the limiter fails open —
    # so persistence buys nothing and an fsync on every INCR would be a real
    # cost on the hot path.
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notification-app
    depends_on:
      postgres:
        # service_healthy, not service_started. Without it the application
        # races the database, Flyway fails to connect and the container exits.
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Service names, resolved on the shared compose network. Not localhost —
      # inside a container that is the container itself.
      NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/notification_db
      NOTIFICATION_DB_USERNAME: ${NOTIFICATION_DB_USERNAME:?set NOTIFICATION_DB_USERNAME in .env}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set NOTIFICATION_DB_PASSWORD in .env}
      NOTIFICATION_KAFKA_BOOTSTRAP: kafka:9092
      NOTIFICATION_REDIS_HOST: redis
      NOTIFICATION_REDIS_PORT: 6379
      NOTIFICATION_JWT_SECRET: ${NOTIFICATION_JWT_SECRET:?set NOTIFICATION_JWT_SECRET in .env}
      NOTIFICATION_ADMIN_USERNAME: ${NOTIFICATION_ADMIN_USERNAME:-}
      NOTIFICATION_ADMIN_PASSWORD: ${NOTIFICATION_ADMIN_PASSWORD:-}
      # Simulation stays ON here: this stack is for local development and
      # demonstration. The application refuses to start with simulation enabled
      # under the `prod` profile, so this cannot leak into production.
      NOTIFICATION_SIMULATION: "true"
      SERVER_PORT: 8080
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres-data:
    name: notification-postgres-data
  kafka-data:
    name: notification-kafka-data
