# =============================================================================
#  CI — build, test and verify
# =============================================================================
#  Runs the full suite against real PostgreSQL, Kafka and Redis as service
#  containers.
#
#  CI is also the only place the Testcontainers-tagged tests can run: the
#  machine this project was developed on has no usable Docker daemon, so those
#  tests have never executed locally. That is stated in docs/TEST-REPORT.md
#  rather than left to be assumed.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: notification_test_db
          POSTGRES_USER: notification_app
          # CI-only, ephemeral, and in the workflow file on purpose: pretending
          # a throwaway container password is a secret teaches the wrong lesson
          # about which values actually matter.
          POSTGRES_PASSWORD: ci-ephemeral-password
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notification_app -d notification_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      kafka:
        image: apache/kafka:3.9.0
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          # Single node: anything above 1 leaves every topic under-replicated
          # and offset commits failing.
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
        ports:
          - 9092:9092

    env:
      NOTIFICATION_DB_URL: jdbc:postgresql://127.0.0.1:5432/notification_test_db
      NOTIFICATION_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/notification_test_db
      NOTIFICATION_DB_USERNAME: notification_app
      NOTIFICATION_DB_PASSWORD: ci-ephemeral-password
      NOTIFICATION_KAFKA_BOOTSTRAP: 127.0.0.1:9092
      NOTIFICATION_REDIS_HOST: 127.0.0.1
      NOTIFICATION_REDIS_PORT: 6379
      # 32 bytes of key material. Worthless outside this job — it signs nothing
      # that leaves the runner.
      NOTIFICATION_JWT_SECRET: Y2ktb25seS1zaWduaW5nLWtleS1uZXZlci11c2VkLWVsc2V3aGVyZSE=
      # No account is bootstrapped in CI; the tests create their own.
      NOTIFICATION_ADMIN_USERNAME: ""
      NOTIFICATION_ADMIN_PASSWORD: ""

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make the Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Compile
        run: ./mvnw -B clean compile

      - name: Unit tests
        # Integration, concurrency, Kafka, Redis and Testcontainers tags are all
        # excluded here; they run in the verify step below.
        run: ./mvnw -B test

      - name: Wait for Kafka to be serving
        # The port binds well before the controller has elected a leader and the
        # broker can answer, so a TCP check would pass too early and the first
        # test would fail on a timeout.
        run: |
          for i in $(seq 1 30); do
            if timeout 5 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9092' 2>/dev/null; then
              echo "Kafka port open after ${i}s"
              sleep 10   # allow controller election to settle
              exit 0
            fi
            sleep 1
          done
          echo "::error::Kafka did not become reachable"
          exit 1

      - name: Apply migrations to the test database
        run: ./mvnw -B flyway:migrate
        env:
          FLYWAY_URL: jdbc:postgresql://127.0.0.1:5432/notification_test_db
          FLYWAY_USER: notification_app
          FLYWAY_PASSWORD: ci-ephemeral-password

      - name: Integration, security and concurrency tests
        run: ./mvnw -B verify -Pintegration

      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, sys, pathlib
          report = pathlib.Path('target/site/jacoco/jacoco.xml')
          if not report.exists():
              print('No coverage report produced'); sys.exit(0)
          root = ET.parse(report).getroot()
          for counter in root.findall('counter'):
              missed, covered = int(counter.get('missed')), int(counter.get('covered'))
              total = missed + covered
              pct = 100.0 * covered / total if total else 0.0
              print(f"{counter.get('type'):12} {covered:5}/{total:5}  {pct:5.1f}%")
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          retention-days: 7

      - name: Package
        run: ./mvnw -B package -DskipTests

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Gitleaks needs history to scan commits, not just the working tree.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert .env is not tracked
        # Belt and braces alongside .gitignore: a `git add -f` would slip past it.
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked in Git. It contains the database password and the JWT signing key."
            exit 1
          fi
          echo ".env is not tracked."
