# =============================================================================
#  Integration-test configuration
# =============================================================================
#  Active for every @SpringBootTest in this project.
#
#  Points at notification_test_db, a SEPARATE database from the development
#  one. Sharing a database between a running application and a test suite that
#  deletes rows between classes is a reliable way to lose work in progress.
#
#  No credentials live here. They come from ./.env, which is generated by
#  scripts/provision-db.sh and is git-ignored — the same file the application
#  itself reads, imported below by the same mechanism.
# =============================================================================
spring:
  config:
    import: "optional:file:./.env[.properties]"

  datasource:
    url: ${NOTIFICATION_TEST_DB_URL:jdbc:postgresql://127.0.0.1:5432/notification_test_db}
    username: ${NOTIFICATION_DB_USERNAME:notification_app}
    password: ${NOTIFICATION_DB_PASSWORD}
    hikari:
      pool-name: notification-test-pool
      # Larger than the default so the concurrency tests can actually run
      # concurrently. A small pool would serialise contending threads at the
      # connection layer and the test would pass for the wrong reason — it
      # would be measuring the pool, not the database.
      maximum-pool-size: 30
      minimum-idle: 5

  jpa:
    hibernate:
      # Flyway owns the schema here exactly as in production. create-drop would
      # mean the suite validates Hibernate's idea of the schema rather than the
      # migrations that will actually run.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

  kafka:
    bootstrap-servers: ${NOTIFICATION_KAFKA_BOOTSTRAP:127.0.0.1:9092}
    consumer:
      # A distinct group so the test consumer does not steal messages from a
      # development instance running against the same broker.
      group-id: notification-service-test
      auto-offset-reset: earliest

notification:
  jwt:
    # A fixed, well-known test key. Safe to commit precisely because it is
    # worthless: it signs nothing outside this suite, and the tests need a
    # deterministic value. The real key comes from .env and is never in Git.
    secret: dGVzdC1vbmx5LXNpZ25pbmcta2V5LW5vdC1hLXNlY3JldC0zMi1ieXRlcyE=
    issuer: notification-service
    access-token-ttl: PT60M

  kafka:
    # Test-only topics, so an integration run cannot interfere with a
    # development instance — or with the other project sharing this broker.
    topic: notifications.test.requested.v1
    retry-topic: notifications.test.requested.v1.retry
    dlt-topic: notifications.test.requested.v1.DLT
    partitions: 1
    replication-factor: 1

  outbox:
    # Faster than production so tests do not wait a second per poll.
    poll-interval: PT0.2S
    batch-size: 50
    lease-duration: PT2M
    max-publish-attempts: 3

  delivery:
    max-attempts: 3
    initial-backoff: PT0.5S
    backoff-multiplier: 2.0
    max-backoff: PT5S
    # Zero, so retry timing is deterministic and assertable. Jitter is tested
    # separately and directly in RetryPolicyTest.
    jitter-factor: 0.0

  providers:
    simulation-enabled: true
    simulated-latency: PT0S
    # Deterministic. Outcomes are scripted per-recipient instead.
    failure-rate: 0.0

  rate-limit:
    # Off by default so ordinary tests are not throttled. The rate-limit test
    # turns it back on itself with @TestPropertySource.
    enabled: false
    capacity: 100
    window: PT1M
    fail-open: true

  admin:
    # No account is bootstrapped; tests create their own, so there is no
    # committed credential and no dependency on .env contents.
    username: ""
    password: ""

logging:
  level:
    root: WARN
    com.bhavesh.notification: INFO
    org.springframework.test: WARN
    org.apache.kafka: ERROR
    org.hibernate.SQL: WARN
