spring:
  application:
    name: notification-service

  # Loads KEY=VALUE pairs from ./.env (generated by scripts/provision-db.sh).
  # `.env` is .properties-shaped, so Spring's native config import handles it
  # and no dotenv dependency is needed. Absent file => ignored (CI uses real
  # environment variables).
  #
  # NOTE: this resolves relative to the WORKING DIRECTORY, not the jar. If you
  # run from an IDE, the run configuration's working directory must be the
  # project root or none of these values resolve. See docs/TROUBLESHOOTING.md.
  config:
    import: "optional:file:./.env[.properties]"

  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://127.0.0.1:5432/notification_db}
    username: ${NOTIFICATION_DB_USERNAME:notification_app}
    password: ${NOTIFICATION_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: notification-pool
      # Sized for the outbox publisher and the Kafka consumers competing with
      # request threads. Too small and the publisher starves the API.
      maximum-pool-size: 16
      minimum-idle: 4
      connection-timeout: 10000      # fail fast rather than hanging a request thread
      max-lifetime: 1800000
      validation-timeout: 3000

  jpa:
    # Flyway is the single source of truth for the schema. `validate` makes the
    # application refuse to start if an entity mapping drifts from the
    # migrations. Never `update` or `create-drop`.
    hibernate:
      ddl-auto: validate
    # OSIV pins a database connection to the request thread for the whole
    # request, including JSON serialisation. It exhausts the pool under load
    # and hides N+1 queries behind lazy loads that silently succeed. Off.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC             # every Instant round-trips as UTC
          batch_size: 30
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true             # `flyway:clean` can never run against this config

  kafka:
    bootstrap-servers: ${NOTIFICATION_KAFKA_BOOTSTRAP:127.0.0.1:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # acks=all: the leader waits for every in-sync replica before
      # acknowledging. The outbox marks an event published only on
      # acknowledgement, so a weaker setting would let us record "published"
      # for a message that a leader failure then loses — which is exactly the
      # failure the outbox exists to prevent.
      acks: all
      retries: 5
      properties:
        # Without this, a retry can reorder messages relative to each other.
        max.in.flight.requests.per.connection: 1
        # Producer-level dedup within a session, so a retried send does not
        # append the record twice.
        enable.idempotence: true
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
        linger.ms: 5

    consumer:
      group-id: ${NOTIFICATION_KAFKA_GROUP:notification-service}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # earliest: a fresh consumer group must process events already in the
      # topic. `latest` would silently skip everything published before the
      # consumer first started — on a restart with a new group id, that is
      # every pending notification.
      auto-offset-reset: earliest
      # Offsets are committed by the container after the listener returns
      # successfully, never on a timer. Auto-commit would acknowledge a message
      # the listener had not finished with.
      enable-auto-commit: false
      max-poll-records: 20
      properties:
        # Must exceed the worst-case time to process max-poll-records messages,
        # or the broker evicts the consumer mid-batch and the partition is
        # rebalanced away while work is in flight.
        max.poll.interval.ms: 300000
        session.timeout.ms: 45000

    listener:
      ack-mode: record               # commit after each record, not each batch
      concurrency: 2                 # two consumer threads per listener
      missing-topics-fatal: false    # topics are created on first use locally

  data:
    redis:
      host: ${NOTIFICATION_REDIS_HOST:127.0.0.1}
      port: ${NOTIFICATION_REDIS_PORT:6379}
      password: ${NOTIFICATION_REDIS_PASSWORD:}
      timeout: 2s                    # a slow cache must not slow the request
      connect-timeout: 2s
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 1

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

  threads:
    virtual:
      enabled: false                 # JDBC-bound workload; the pool is the real limit

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never           # never leak internals through the default error page
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  shutdown: graceful

# ---------------------------------------------------------------- application --
notification:

  jwt:
    secret: ${NOTIFICATION_JWT_SECRET}
    issuer: ${NOTIFICATION_JWT_ISSUER:notification-service}
    access-token-ttl: ${NOTIFICATION_JWT_ACCESS_TTL:PT60M}
    clock-skew: PT30S

  kafka:
    # Topic names are namespaced and versioned. The version suffix means a
    # breaking payload change can run alongside the old one during a migration
    # instead of requiring a flag day.
    #
    # NOTE: this Kafka broker is shared with the FinSight project on this
    # machine. The `notifications.` prefix keeps the two sets disjoint.
    topic: ${NOTIFICATION_TOPIC:notifications.requested.v1}
    retry-topic: ${NOTIFICATION_RETRY_TOPIC:notifications.requested.v1.retry}
    dlt-topic: ${NOTIFICATION_DLT_TOPIC:notifications.requested.v1.DLT}
    partitions: 3
    replication-factor: 1            # single-node local broker

  outbox:
    # The publisher polls rather than using logical decoding or a CDC
    # connector. Polling is less efficient and vastly simpler to operate, and
    # at this volume the difference is not measurable. Documented in
    # docs/ARCHITECTURE.md.
    poll-interval: ${NOTIFICATION_OUTBOX_POLL:PT1S}
    batch-size: 50
    # A claim older than this is assumed to belong to a dead publisher and is
    # reclaimed. Must exceed the worst-case time to publish one batch.
    lease-duration: PT2M
    max-publish-attempts: 5

  delivery:
    max-attempts: 3
    # Exponential backoff: 2s, 4s, 8s ... capped. Jitter spreads a thundering
    # herd of simultaneous retries that would otherwise all fire at once.
    initial-backoff: PT2S
    backoff-multiplier: 2.0
    max-backoff: PT1M
    jitter-factor: 0.2

  providers:
    # SIMULATION MODE. No email or SMS is actually sent. Enabled by default so
    # the application runs on a developer machine with no paid accounts, no
    # real phone numbers and no SMTP credentials.
    #
    # The API, the logs and the documentation all state this explicitly —
    # reporting a simulated send as a real one would be a lie that is very easy
    # to tell by accident.
    simulation-enabled: ${NOTIFICATION_SIMULATION:true}
    # Artificial latency, so the asynchronous pipeline is observable rather
    # than completing instantly.
    simulated-latency: ${NOTIFICATION_SIM_LATENCY:PT0.05S}
    # Deterministic by default: 0.0 means never fail spontaneously. Tests and
    # demonstrations request a specific outcome per message instead, because a
    # random failure rate makes a test suite flaky and a demo unreproducible.
    failure-rate: ${NOTIFICATION_SIM_FAILURE_RATE:0.0}

  rate-limit:
    enabled: ${NOTIFICATION_RATE_LIMIT_ENABLED:true}
    # Requests permitted per window, per authenticated caller.
    capacity: ${NOTIFICATION_RATE_LIMIT_CAPACITY:100}
    window: ${NOTIFICATION_RATE_LIMIT_WINDOW:PT1M}
    # FAIL-OPEN. If Redis is unreachable the limiter allows the request and
    # logs a warning. A rate limiter is a protection mechanism, not a
    # correctness one; failing closed would turn a cache outage into a total
    # outage of notification intake. The trade-off is deliberate and is
    # documented in docs/ARCHITECTURE.md.
    fail-open: true

  admin:
    # Development API consumer, created once at startup ONLY when both values
    # are present AND the active profile is not `prod`. No credential is
    # committed; scripts/provision-db.sh generates one into .env.
    username: ${NOTIFICATION_ADMIN_USERNAME:}
    password: ${NOTIFICATION_ADMIN_PASSWORD:}

  cors:
    allowed-origins: ${NOTIFICATION_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# --------------------------------------------------------------- observability --
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,flyway
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      show-components: when_authorized
      probes:
        enabled: true                # /actuator/health/liveness + /readiness
  health:
    redis:
      enabled: true
    db:
      enabled: true
  metrics:
    tags:
      application: notification-service

info:
  app:
    name: Notification Service
    description: Asynchronous multi-channel notifications with a transactional outbox
    version: 1.0.0

# ------------------------------------------------------------------- openapi --
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
  default-produces-media-type: application/json

logging:
  level:
    root: INFO
    com.bhavesh.notification: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.apache.kafka: WARN
    org.apache.kafka.clients.NetworkClient: ERROR   # silences broker-reconnect noise
    org.flywaydb: INFO
  pattern:
    # traceId and notificationId come from the MDC, so every line of an
    # asynchronous pipeline can be correlated back to the originating request.
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%5p) %clr([%X{traceId:-},%X{notificationId:-}]){magenta} %clr(%-42.42logger{39}){cyan} : %m%n%wEx"

---
# =====================================================================
#  prod profile — safe defaults for a real deployment
# =====================================================================
spring:
  config:
    activate:
      on-profile: prod

notification:
  admin:
    # Bootstrapping an API consumer from environment variables is a
    # development convenience. Under `prod` it is disabled unconditionally, so
    # a leaked NOTIFICATION_ADMIN_PASSWORD cannot mint an account in
    # production.
    username: ""
    password: ""
  providers:
    # Simulation must never be on in production: it would report notifications
    # as delivered when nothing was sent. The application refuses to start if
    # this is true under the prod profile — see ProviderProperties.
    simulation-enabled: false

logging:
  level:
    com.bhavesh.notification: INFO
